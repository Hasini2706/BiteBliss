spring.application.name=onlinefood-backend
server.port=8081

# Active Profile: 'dev' runs embedded H2 in MySQL mode for instant out-of-the-box execution without local MySQL setup.
# Switch to 'mysql' (or run with -Dspring.profiles.active=mysql) to connect to local MySQL server.
spring.profiles.active=dev

# AOP configuration
spring.aop.auto=true
spring.aop.proxy-target-class=true

# Logging
logging.level.com.onlinefood=INFO
logging.level.org.springframework.ws=INFO

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# MongoDB Configuration (Local MongoDB Server running on port 27017)
spring.data.mongodb.uri=mongodb://localhost:27017/bitebliss
spring.data.mongodb.database=bitebliss
spring.data.mongodb.auto-index-creation=true
