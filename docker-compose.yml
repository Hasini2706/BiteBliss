version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: bitebliss-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bitebliss-net

  bitebliss-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitebliss-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/bitebliss
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=8081
    depends_on:
      - mongodb
    networks:
      - bitebliss-net

volumes:
  mongo_data:

networks:
  bitebliss-net:
    driver: bridge
