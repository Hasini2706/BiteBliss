<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BiteBliss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; padding-top: 0;">
    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a class="brand-logo justify-content-center" href="index.html">
                <span>🍕</span> BiteBliss <span class="brand-badge">REGISTER</span>
            </a>
            <p class="text-muted small mt-2">Join to order from 100+ delicious dishes</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <h4 class="fw-bold mb-3">Create Account</h4>
            
            <div id="error-msg" class="alert alert-danger d-none py-2 small"></div>

            <form onsubmit="register(event)">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="9876543210" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary-gradient w-100 py-3 fs-6">Sign Up ➔</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Already have an account? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--primary-orange);">Log In</a></small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
